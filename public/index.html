:root{--bg:#0a0a0a;--side:#111111;--top:#0f0f0f;--bd:#1e1e1e;--fg:#e4e4e7;--mut:#71717a;--acc:#3b82f6;--hov:#1a1a1a;--sel:rgba(59,130,246,.1);--ok:#22c55e;--wn:#f59e0b;--bad:#ef4444}
*{box-sizing:border-box;box-shadow:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:400 14px/1.5 Geist,system-ui,-apple-system,Segoe UI,sans-serif}
h1{font-size:20px;font-weight:500;margin:0}h3{font-size:16px;font-weight:500;margin:0 0 12px}h4{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:500;margin:0 0 10px}p{margin:4px 0}
.mut,small{color:var(--mut)}b{font-weight:500}a{color:inherit}
input,select,textarea,button{font:inherit;color:var(--fg);border:1px solid var(--bd);border-radius:6px;background:var(--hov);height:32px;padding:0 10px}
textarea{height:auto;padding:8px 10px}option{background:var(--hov)}
:focus-visible{outline:1px solid var(--acc);outline-offset:-1px}
button{cursor:pointer;padding:0 12px;font-weight:500}button:hover{background:#222}button.p{background:var(--acc);border-color:var(--acc);color:#fff}button.p:hover{background:#2f73e0}button.d{color:var(--bad)}
label{display:block;font-size:12px;color:var(--mut);margin-top:10px}label>*{display:block;width:100%;margin-top:4px}
kbd{font:500 11px Geist,sans-serif;color:var(--mut);border:1px solid var(--bd);border-radius:4px;padding:1px 6px;background:var(--bg)}
#nc,#cp{display:none}
.app{display:grid;grid-template-columns:240px 1fr;height:100vh;overflow:hidden}#nc:checked~.app{grid-template-columns:60px 1fr}
aside{background:var(--side);border-right:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden;min-width:0}
.logo{height:52px;flex:none;display:flex;align-items:baseline;gap:8px;padding:16px;border-bottom:1px solid var(--bd);font-weight:500;font-size:15px}.logo small{font-size:11px}
.nvs{flex:1;overflow:auto;padding:8px 8px}.ng{padding:8px 0}.ngh{font-size:11px;letter-spacing:.1em;color:var(--mut);padding:4px 10px 6px}
.nv{display:flex;align-items:center;gap:10px;height:32px;padding:0 8px;border-left:2px solid transparent;color:var(--mut);cursor:pointer;font-weight:500;white-space:nowrap}
.nv:hover{background:var(--hov);color:var(--fg)}.nv.on{background:var(--sel);border-left-color:var(--acc);color:var(--fg)}
.ini{flex:none;width:26px;height:20px;display:grid;place-items:center;font-size:10px;font-weight:500;border:1px solid var(--bd);border-radius:4px}
.sbb{flex:none;border-top:1px solid var(--bd);display:flex;align-items:center;gap:10px;padding:10px 12px}.sbb .un{flex:1;min-width:0;line-height:1.3}.sbb .un div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{flex:none;width:28px;height:28px;border-radius:50%;background:var(--hov);border:1px solid var(--bd);display:grid;place-items:center;font-size:11px;font-weight:500}
.xb{flex:none;width:28px;height:28px;display:grid;place-items:center;border:1px solid var(--bd);border-radius:6px;cursor:pointer;color:var(--mut)}.xb:hover{background:var(--hov);color:var(--fg)}
#nc:checked~.app .l,#nc:checked~.app .ngh,#nc:checked~.app .logo small,#nc:checked~.app .un{display:none}
#nc:checked~.app .nv{justify-content:center;padding:0}#nc:checked~.app .sbb{flex-direction:column;padding:10px 0}#nc:checked~.app .logo{justify-content:center;padding:0}
.mc{display:flex;flex-direction:column;min-width:0;height:100vh}
.top{flex:none;height:52px;display:grid;grid-template-columns:1fr minmax(200px,420px) 1fr;align-items:center;gap:16px;padding:0 24px;background:var(--top);border-bottom:1px solid var(--bd)}
.bc{color:var(--mut)}.bc b{color:var(--fg)}.bc span{margin:0 4px}
.sbx{position:relative;display:block;margin:0;cursor:text}.sbx input{width:100%;padding-right:48px;cursor:text}.sbx kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%)}
.tr{display:flex;justify-content:flex-end;align-items:center;gap:12px}.bell{min-width:32px;padding:0 8px;color:var(--mut)}.bell.has{color:var(--fg);border-color:var(--acc);background:var(--sel)}
main{flex:1;overflow:auto;padding:32px}
.ph{margin-bottom:24px}.ph p{color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.st{background:var(--side);border:1px solid var(--bd);border-radius:8px;padding:14px 16px}.st .l{font-size:12px;color:var(--mut)}.st .n{font-size:26px;font-weight:500;line-height:1.2;margin-top:2px}.st .s{font-size:12px;color:var(--mut)}
.card{background:var(--side);border:1px solid var(--bd);border-radius:8px;padding:16px;margin-bottom:12px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;margin-bottom:12px}.g2>.card{margin:0}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1 1 140px}.row>button{flex:0 1 auto}
.tb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tb input{flex:1 1 220px}.tb select{flex:0 1 160px}
.tw{border:1px solid var(--bd);border-radius:8px;overflow:auto;background:var(--side)}
table{width:100%;border-collapse:collapse}th{position:sticky;top:0;background:var(--side);text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:500;padding:9px 12px;border-bottom:1px solid var(--bd);cursor:pointer;white-space:nowrap}th.on{color:var(--fg);box-shadow:none;border-bottom-color:var(--acc)}

V.inv=()=>{const cats=Object.keys(S.cats).sort(),o=(a,v)=>a.map(x=>`<option ${x==v?'selected':''}>${E(x)}`).join('');
 $('#v').innerHTML=`<div class="row ph" style="justify-content:space-between"><div style="flex:1 1 200px"><h1>Inventory</h1><p id=cn></p></div><button onclick="impCsv()">Import CSV</button><button class=p onclick="eqForm()">+ Add equipment</button></div>
 <div class=tb><input id=sq placeholder="Filter by UID, brand, model, serial…" value="${E(q)}" oninput="q=this.value;invBody()"><select onchange="fc=this.value;invBody()"><option value="">All categories${o(cats,fc)}</select>
 <select onchange="fl=this.value;invBody()"><option value="">All locations${o(S.locs,fl)}</select><select onchange="fs=this.value;invBody()"><option value="">Any status<option value=out ${fs=='out'?'selected':''}>Checked out<option value=over ${fs=='over'?'selected':''}>Overdue<option value=due ${fs=='due'?'selected':''}>Needs service</select></div><div id=ib></div>`;invBody()};
function invBody(){const f=filt().sort((a,b)=>{const x=SORT[srt.k](a),y=SORT[srt.k](b);return(x>y?1:x<y?-1:0)*srt.d});const th=(k,l,c)=>`<th class="${c||''} ${srt.k==k?'on':''}" onclick="srt={k:'${k}',d:srt.k=='${k}'?-srt.d:1};invBody()">${l}</th>`;
 $('#cn').textContent=`${f.length} of ${S.items.length} records`;

 (f.length?`<div class=tw><table><thead><tr><th style="width:36px"><input type=checkbox ${f.every(i=>sel.has(i.uid))?'checked':''} onclick="tall(this.checked)"></th>${th('uid','UID')}${th('item','Item')}${th('loc','Location','hm')}${th('status','Status')}${th('cond','Condition','hm')}</tr></thead><tbody>${f.map(i=>`<tr onclick="det('${i.uid}')"><td onclick="event.stopPropagation()"><input type=checkbox ${sel.has(i.uid)?'checked':''} onclick="tsel('${i.uid}',this.checked)"></td><td><span class=uid>${i.uid}</span></td><td>${E(i.brand)} ${E(i.model)}<div class=sub>${E(i.cat)}${i.kind!='single'?' · '+(i.kind=='set'?'Kit':'Bulk'):''}</div></td><td class=hm>${E(i.loc)}</td><td>${st(i)}${i.due?' '+pill('Service','bad'):''}</td><td class=hm>${pill(E(i.cond),bad(i)?'bad':'')}</td></tr>`).join('')}</tbody></table></div>`:empty(S.items.length?'No equipment matches these filters.':'No equipment yet. Add an item or import a CSV to get QR tags.'))}

 $('#v').innerHTML=`<div class=ph><h1>Activity</h1><p>Every check-out, move, repair and change, newest first.</p></div><div class=tb><div class=chips>${Object.entries(T).map(([k,n])=>`<button class="${af==k?'on':''}" onclick="af='${k}';V.act()">${n}</button>`).join('')}</div></div>`+
 (()=>{const e=evs().filter(x=>!af||x.type==af).slice(0,300);return e.length?`<div class=tw><table><thead><tr><th>When</th><th>Who</th><th>Item</th><th>Event</th></tr></thead><tbody>${e.map(x=>`<tr onclick="det('${x.uid}')"><td class=sub style="white-space:nowrap">${fmt(x)}</td><td>${E(x.by)}</td><td><span class=uid>${x.uid}</span></td><td>${E(x.txt)}</td></tr>`).join('')}</tbody></table></div>`:empty('No activity yet.')})()};

 $('#v').innerHTML=`<div class="row ph" style="justify-content:space-between"><div style="flex:1 1 200px"><h1>Reports</h1><p>Department summary.</p></div><button onclick="csv()">Export CSV</button><button onclick="print()">Print</button></div>
 <div class=stats>${stat('Records',S.items.length)}${stat('Out now',out.length,n.over.length+' overdue')}${stat('Need service',n.due.length)}${stat('Low stock',n.low.length)}</div>
 <div class=g2><div class=card><h4>By category</h4>${bars('cat')}</div><div class=card><h4>By location</h4>${bars('loc')}</div></div>

V.set=()=>{const cats=Object.entries(S.cats).sort();
 $('#v').innerHTML=`<div class=ph><h1>Settings</h1><p>Account, categories and data.</p></div><div class=g2>
 <div class=card><h4>Account</h4><p>${E(me.name)} · ${me.role=='admin'?'Web admin':'Core user'}</p><div class=acts style="margin-top:12px"><button onclick="cpw()">Change password</button><button onclick="logout()">Sign out →</button></div></div>
 <div class=card><h4>Data</h4><div class=acts><button onclick="impCsv()">Import CSV</button><button onclick="tpl()">CSV template</button><button onclick="csv()">Export CSV</button>${adm()?'<button onclick="bak()">Full backup (JSON)</button>':''}</div></div></div>
 <div class=card><div class=row style="justify-content:space-between"><h4 style="margin:0;flex:1">Categories</h4><button onclick="mkCat()">+ New category</button></div><div class=tw style="margin-top:12px"><table><thead><tr><th>Name</th><th>UID code</th><th>Records</th></tr></thead><tbody>${cats.map(([n,c])=>`<tr style="cursor:default"><td>${E(n)}</td><td><span class=uid>${E(c)}</span></td><td>${S.items.filter(i=>i.cat==n).length}</td></tr>`).join('')||'<tr><td colspan=3 class=mut>No categories yet. They are created when you add equipment.</td></tr>'}</tbody></table></div></div>
 ${adm()?`<div class=card><h4>Integrations</h4><label>Google OAuth Client ID (optional, needs internet)<input id=gci placeholder="Paste client ID" onchange="api('/api/settings','PUT',{google:this.value}).then(()=>toast('Saved. Reload to apply.'))"></label><div style="margin-top:10px"><button onclick="imp()">Import data from old offline version</button></div></div>`:''}`;
 if(adm())pend().then(()=>{const g=$('#gci');if(g)g.value=GOOGLE||''})};
async function mkCat(){const r=await ask('New category',[{l:'Category name',p:'e.g. Microphone'},{l:'3-letter code for the UID',p:'blank = automatic',max:3}],'Create');if(!r||!r[0].trim())return;const n=r[0].trim();
 let c=(r[1].trim()||code(n,3)).toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,3).padEnd(3,'X');if(S.cats[n]||Object.values(S.cats).includes(c))return toast('That name or code already exists');S.cats[n]=c;save();V.set()}
const tpl=()=>dlText('cadence-template.csv','category,brand,model,serial,condition,location,type,quantity,notes\nMicrophone,Shure,SM58,12345,Good,Blue Crate 2 (Multipurpose),single,1,\nCable,Generic,XLR 3m,,Good,Blue Crate 1,pool,20,Black\n');
function csvParse(t){const R=[];let r=[],f='',qq=false;for(let k=0;k<t.length;k++){const c=t[k];if(qq){if(c=='"'){if(t[k+1]=='"'){f+='"';k++}else qq=false}else f+=c}else if(c=='"')qq=true;else if(c==','){r.push(f);f=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[k+1]=='\n')k++;r.push(f);f='';if(r.some(x=>x.trim()))R.push(r);r=[]}else f+=c}r.push(f);if(r.some(x=>x.trim()))R.push(r);return R}
function impCsv(){const f=document.createElement('input');f.type='file';f.accept='.csv,text/csv';f.onchange=async()=>{const R=csvParse(await f.files[0].text());if(R.length<2)return toast('That CSV has no rows');
 const h=R.shift().map(x=>x.trim().toLowerCase()),g=(r,n)=>((r[h.indexOf(n)]||'').trim()),ok=R.filter(r=>g(r,'category'));
 if(!ok.length)return toast('Needs a "category" column. Use the CSV template.');const a=await ask('Import CSV',[{t:'msg',v:ok.length+' items will be added with auto-generated UIDs.'}],'Import');if(!a)return;
 ok.forEach(r=>{const cat=g(r,'category'),br=g(r,'brand')||'Generic',k=['pool','set'].includes(g(r,'type').toLowerCase())?g(r,'type').toLowerCase():'single',loc=g(r,'location')||S.locs[0];
  if(!S.cats[cat]){let c=code(cat,3),n=0;while(Object.values(S.cats).includes(c))c=code(cat,2)+'23456789ABCDEFGH'[n++];S.cats[cat]=c}if(!S.locs.includes(loc))S.locs.push(loc);
  const i={id:nid(),cat,brand:br,model:g(r,'model'),serial:g(r,'serial'),cond:g(r,'condition')||'Good',loc,kind:k,qty:k=='pool'?(+g(r,'quantity')||1):1,out:0,status:'in',holder:'',due:false,dueat:'',notes:g(r,'notes'),contents:'',hist:[]};
  i.uid=rnd(pre(cat,br));L(i,'note','Imported from CSV');S.items.push(i)});save();toast(ok.length+' items imported');go('inv')};f.click()}

let lastC='',lastT=0;
function onScan(c){const now=Date.now();if(c==lastC&&now-lastT<2500)return;lastC=c;lastT=now;navigator.vibrate&&navigator.vibrate(50);
 if(c.startsWith('LOC:')){const l=c.slice(4);if(sm=='move'&&S.locs.includes(l)){$('#sl').value=l;return feed('Target: '+l)}stop();return locView(l)}

function eqForm(uid){const i=uid?get(uid):{uid:'',cat:'',brand:'',model:'',serial:'',cond:'Good',loc:S.locs[0],kind:'single',qty:1,out:0,notes:'',contents:''},ed=!!uid;

function qr(t){const x=qrcode(0,'M');x.addData(t);x.make();return x.createSvgTag({scalable:true,margin:2})}
let hf='';
function det(u,keep){const i=get(u);if(!i)return;if(!keep)hf='';const IC={io:'',m:'',cond:'',loc:'',note:''},hs=(i.hist||[]).filter(x=>!hf||x.type==hf);
 const f=(l,v)=>`<div><small>${l}</small>${v||'—'}</div>`;
 M(`<div class=dh><div class="ic big">${ICO(i.cat)}</div><div><h3>${E(i.brand)} ${E(i.model)}</h3><div class=row style="gap:6px"><span class=uid style="flex:none">${i.uid}</span>${st(i)}${i.due?pill(' Service due','bad'):''}</div></div></div>
 <div class=row style="margin-top:14px;align-items:flex-start"><div style="flex:1 1 280px"><div class=info style="margin-top:0">${f('Category',E(i.cat))}${f('Serial',E(i.serial))}${f('Condition',pill(E(i.cond),bad(i)?'bad':'ok'))}${f('Location',' '+E(i.loc))}${f('Type',i.kind=='single'?'Individual':i.kind=='set'?'Kit / set':'Bulk pool')}${i.kind=='pool'?f('In store',`${i.qty-i.out} of ${i.qty}`):f('Status',i.status=='out'?'With '+E(i.holder)+(i.dueat?' · due '+E(i.dueat):''):'In store')}</div></div>
 <div class=qrb>${qr(i.uid)}<b>${i.uid}</b></div></div>
 ${i.kind=='set'?`<h4>Kit contents</h4><div class=chips>${i.contents.split('\n').filter(x=>x.trim()).map(x=>pill(E(x))).join('')||'<span class=mut>No list yet</span>'}</div>`:''}${i.notes?`<h4>Notes</h4><div class=card style="margin:0;white-space:pre-wrap">${E(i.notes)}</div>`:''}
 <h4>Actions</h4><div class=acts><button class=p onclick="out('${u}')"> Check out</button><button class=p onclick="inn('${u}')"> Check in</button><button onclick="mv('${u}')"> Move</button><button onclick="mt('${u}')"> ${i.due?'Mark serviced':'Flag maintenance'}</button><button onclick="eqForm('${u}')"> Edit</button><button onclick="lab('${u}')"> Label</button>${i.kind=='pool'?`<button onclick="cnt('${u}')"> Recount</button>`:''}</div>
 <h4>History</h4><div class=chips>${[['','All'],['io','Check-in/out'],['m','Maintenance'],['cond','Condition'],['loc','Location'],['note','Notes']].map(([k,n])=>`<button class="${hf==k?'on':''}" onclick="hf='${k}';det('${u}',1)">${n}</button>`).join('')}</div>
 <div class=tl>${hs.map(x=>`<div data-i="${IC[x.type]}"><div>${E(x.txt)}</div>${x.ph&&x.ph.length?`<div class=thumbs>${thumbs(x.ph)}</div>`:''}${x.phDel?`<small> ${x.phDel} photo(s) deleted after service</small><br>`:''}<small>${fmt(x)} · ${E(x.by)}</small></div>`).join('')||'<div data-i="∅"><small>Nothing recorded yet</small></div>'}</div>`)}
async function out(u){const i=get(u);
 if(i.kind=='pool'){const av=i.qty-i.out;if(!av)return toast('None left in store');const r=await ask('Check out '+i.uid,[{l:`How many? (${av} available)`,t:'number',v:1,max:av},{l:'Who / which event?'},{l:'Return by (optional)',t:'date'}],'Check out');if(!r)return;const n=+r[0];i.dueat=r[2]||'';if(!n||n<1||n>av)return toast('Invalid quantity');i.out+=n;i.holder=r[1];L(i,'io',`OUT ×${n} → ${r[1]}`)}
 else{if(i.status=='out')return toast('Already checked out');const r=await ask('Check out '+i.uid,[{l:'Checked out to / event?'},{l:'Return by (optional)',t:'date'}],'Check out');if(!r)return;i.status='out';i.holder=r[0];i.dueat=r[1]||'';L(i,'io','OUT → '+r[0])}
 save();det(u,1);toast('Checked out')}
async function inn(u){const i=get(u);
 if(i.kind=='pool'){if(!i.out)return toast('Nothing is out');const r=await ask('Check in '+i.uid,[{l:`How many returned? (${i.out} out)`,t:'number',v:i.out,max:i.out}],'Check in');if(!r)return;const n=+r[0];if(!n||n<1||n>i.out)return toast('Invalid quantity');i.out-=n;if(!i.out)i.dueat='';L(i,'io',`IN ×${n}`)}
 else{if(i.status!='out')return toast('Already in store');let t='IN';
  if(i.kind=='set'){const r=await ask('Check in '+i.uid,[{t:'msg',v:'<b>Contents:</b><br>'+E(i.contents).replace(/\n/g,'<br>')},{l:'Is everything back?',t:'select',o:['Yes, everything is back','No, something is missing']},{l:'If missing, what?'}],'Check in');if(!r)return;
   if(r[1].startsWith('No')){t+=' (MISSING: '+(r[2]||'unspecified')+')';i.due=1;i.notes=(i.notes?i.notes+'\n':'')+T()+' missing: '+(r[2]||'unspecified')}}
  else if(!await ask('Check in '+i.uid,[{t:'msg',v:'Return from '+E(i.holder)+'?'}],'Check in'))return;
  i.status='in';i.dueat='';L(i,'io',t)}
 save();det(u,1);toast('Checked in')}
async function mv(u){const i=get(u),r=await ask('Move '+i.uid,[{l:'Location',t:'select',o:S.locs,v:i.loc},{l:'…or a new location',p:'type to create one'}],'Move');if(!r)return;const l=r[1].trim()||r[0];if(!S.locs.includes(l))S.locs.push(l);if(l!=i.loc){L(i,'loc',`Moved ${i.loc} → ${l}`);i.loc=l}save();det(u,1)}
async function mt(u){const i=get(u);
 if(i.due){const r=await ask('Mark serviced',[{l:'What was done?'},{t:'msg',v:'<span class=mut>Photos attached to the open issue will be deleted. The log entries stay.</span>'}],'Serviced');if(!r)return;
  const ids=(i.hist||[]).flatMap(x=>x.ph||[]);L(i,'m','SERVICED: '+r[0]);i.hist.forEach(x=>{if(x.ph&&x.ph.length){x.phDel=x.ph.length;delete x.ph}});i.due=false;
  await Promise.all(ids.map(id=>api('/api/photos/'+id,'DELETE',{})));save();det(u,1);return toast(ids.length?'Serviced. Photos deleted':'Serviced')}
 const r=await ask('Flag for maintenance',[{l:'What is the issue?'},{t:'photos',l:'Photos (optional, up to 4)'}],'Flag');if(!r)return;
 const ids=[];if(r[1].length){toast('Uploading photos…');for(const d of r[1]){const x=await api('/api/photos','POST',{data:d});if(x.ok)ids.push(x.d.id);else toast(x.d.error||'Upload failed')}}
 L(i,'m','FLAGGED: '+r[0]);if(ids.length)i.hist[0].ph=ids;i.due=true;save();det(u,1)}
async function cnt(u){const i=get(u),r=await ask('Recount '+i.uid,[{l:'Actual total counted (in store + out)',t:'number',v:i.qty}],'Save');if(!r||r[0]==='')return;L(i,'note',`Recount ${i.qty} → ${r[0]}`);i.qty=+r[0];if(i.out>i.qty)i.out=i.qty;save();det(u,1)}
function lab(u){const i=get(u);M(`<h3> Label</h3><div class=qrb style="width:250px;margin:auto;padding:14px">${qr(u)}<b style="font-size:16px;display:block">${u}</b><div style="color:#333;font-size:13px">${E(i.brand)} ${E(i.model)}</div><div style="color:#666;font-size:11px">CADENCE</div></div>
 <div class=acts style="justify-content:center;margin-top:14px"><button class=p onclick="doPrint('${u}')"> Print</button><button onclick="dl('${u}')"> Save PNG</button><button onclick="det('${u}',1)"> Back</button></div>
 <p class=mut style="text-align:center">If printing is blocked in this view, save the PNG and print that, or open the file directly in your browser.</p>`)}
function doPrint(u){const i=get(u);$('#pr').innerHTML=`<div class=lab>${qr(u)}<div class=uid>${u}</div><div>${E(i.brand)} ${E(i.model)}</div></div>`;try{print()}catch{toast('Printing is blocked here. Save the PNG instead.')}}
function dl(u){const i=get(u),im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=420;c.height=520;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,420,520);x.drawImage(im,30,20,360,360);x.fillStyle='#111';x.textAlign='center';x.font='bold 30px monospace';x.fillText(u,210,420);x.font='20px sans-serif';x.fillText((i.brand+' '+i.model).trim(),210,455);x.fillText('CADENCE',210,490);
 const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download=u+'.png';document.body.appendChild(a);a.click();a.remove()};im.src='data:image/svg+xml;base64,'+btoa(qr(u).replace('<svg ','<svg width="360" height="360" '))}
async function catSel(s){if(s.value!='__new'){s.dataset.p=s.value;return pv()}
 const prev=s.dataset.p||Object.keys(S.cats)[0]||'';const r=await ask('New category',[{l:'Category name',p:'e.g. Microphone'},{l:'3-letter code used in the UID',p:'blank = automatic, e.g. MIC',max:3}],'Create');
 if(!r||!r[0].trim()){s.value=prev;return pv()}
 const n=r[0].trim(),c=(r[1].trim()||code(n,3)).toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,3).padEnd(3,'X');
 if(S.cats[n]||Object.values(S.cats).includes(c)){toast('That name or code already exists');s.value=prev;return pv()}
 S.cats[n]=c;save();s.insertBefore(new Option(n,n),s.lastElementChild);s.value=n;s.dataset.p=n;pv()}
async function rmUser(n){const u=US[n],r=await ask((u.ok?'Remove ':'Reject ')+u.name+'?',[{t:'msg',v:'This cannot be undone.'}],'Yes');if(!r)return;const x=await api('/api/users/'+encodeURIComponent(u.name),'DELETE',{});if(!x.ok)toast(x.d.error);await pend();render()}
async function squash(file){const im=await new Promise((ok,no)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);ok(i)};i.onerror=no;i.src=u});
 const w=im.naturalWidth,h=im.naturalHeight,c=document.createElement('canvas');let s=Math.min(1,1600/Math.max(w,h)),q=.82,d;
 for(let k=0;k<10;k++){c.width=Math.round(w*s);c.height=Math.round(h*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);d=c.toDataURL('image/jpeg',q);if((d.length-23)*.75<1e6)break;if(q>.5)q-=.12;else s*=.8}return d}
function zoom(id){const d=document.createElement('div');d.id='dlg';d.innerHTML=`<img src="/api/photos/${id}" style="max-width:100%;max-height:90vh;border-radius:12px">`;d.onclick=()=>d.remove();document.body.appendChild(d)}
const thumbs=ids=>(ids||[]).map(id=>`<img class=th src="/api/photos/${id}" onclick="zoom('${id}')">`).join('');
function ask(title,fields,ok='OK'){return new Promise(res=>{const d=document.createElement('div');d.id='dlg';
 const fh=(f,n)=>f.t=='msg'?`<p>${f.v}</p>`:f.t=='photos'?`<div class=phw><label>${f.l}</label><div class=row style="margin-top:4px"><button type=button class=pc> Take photo</button><button type=button class=pg> Choose</button></div><input type=file accept="image/*" capture=environment hidden class=fc><input type=file accept="image/*" multiple hidden class=fg><div class=thumbs></div></div>`
  :`<label>${f.l}${f.t=='select'?`<select name=f${n}>${f.o.map(o=>`<option ${o==f.v?'selected':''}>${E(o)}`).join('')}</select>`:`<input name=f${n} type=${f.t||'text'} value="${E(f.v??'')}" placeholder="${E(f.p||'')}" ${f.max&&f.t=='number'?'min=1 max='+f.max:f.max?'maxlength='+f.max:''}>`}</label>`;
 d.innerHTML=`<form class=dg><h3>${title}</h3>${fields.map(fh).join('')}<div class=row style="margin-top:14px"><button class=p type=submit>${ok}</button><button type=button class=c>Cancel</button></div></form>`;
 document.body.appendChild(d);const fm=d.firstChild,done=v=>{d.remove();res(v)};fm._ph=[];fm._p=Promise.resolve();
 const ph=fm.querySelector('.phw');if(ph){const th=ph.querySelector('.thumbs'),draw=()=>{th.innerHTML=fm._ph.map((s,k)=>`<div><img src="${s}"><b data-k="${k}">×</b></div>`).join('')+`<small class=mut>${fm._ph.length}/4</small>`};
  const add=fl=>[...fl].forEach(f=>{fm._p=fm._p.then(async()=>{if(fm._ph.length>=4)return toast('Maximum 4 photos');try{fm._ph.push(await squash(f));draw()}catch{toast('Could not read that image')}})});
  ph.querySelector('.pc').onclick=()=>ph.querySelector('.fc').click();ph.querySelector('.pg').onclick=()=>ph.querySelector('.fg').click();
  for(const c of ['.fc','.fg'])ph.querySelector(c).onchange=ev=>{add(ev.target.files);ev.target.value=''};
  th.onclick=ev=>{const k=ev.target.dataset.k;if(k!=null){fm._ph.splice(+k,1);draw()}};draw()}
 fm.onsubmit=async ev=>{ev.preventDefault();await fm._p;done(fields.map((f,n)=>f.t=='photos'?fm._ph:fm.elements['f'+n]?fm.elements['f'+n].value:null))};
 fm.querySelector('.c').onclick=()=>done(null);d.onclick=ev=>{if(ev.target==d)done(null)};const f=fm.querySelector('input:not([type=file]),select');f&&f.focus()})}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
V.scan=()=>{$('#v').innerHTML=`<h3> Scan a tag</h3><div class=vf><video id=vd playsinline muted></video></div><p id=sm class=mut>Starting camera…</p>
 <div class="card row"><input id=mu placeholder="Or type a UID, e.g. MIC-SH-0421" onkeydown="event.key=='Enter'&&mu()"><button class=p onclick="mu()">Open</button></div>`;cam()};
function mu(){const u=$('#mu').value.trim().toUpperCase();get(u)?det(u):toast('Unknown UID')}
async function cam(){try{if(!navigator.mediaDevices)throw 0;stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});
 const v=$('#vd');v.srcObject=stream;await v.play();$('#sm').textContent='Camera ready.';const c=document.createElement('canvas'),x=c.getContext('2d',{willReadFrequently:true});
 const tick=()=>{if(!stream)return;if(v.videoWidth){const w=Math.min(640,v.videoWidth);c.width=w;c.height=w*v.videoHeight/v.videoWidth;x.drawImage(v,0,0,c.width,c.height);
  const r=jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height);if(r&&r.data)onScan(r.data)}raf=requestAnimationFrame(tick)};tick()}
 catch{$('#sm').textContent='Camera unavailable. Browsers only allow it on https:// or localhost. Type a UID instead.'}}
function stop(){cancelAnimationFrame(raf);stream&&stream.getTracks().forEach(t=>t.stop());stream=null}

V.maint=()=>{const d=S.items.filter(i=>i.due||bad(i));
 $('#v').innerHTML=`<h3> Maintenance queue <span class=pill>${d.length}</span></h3>`+(d.map(i=>`${card(i)}${(i.hist||[]).find(x=>x.type=='m')?`<div class=mut style="margin:-4px 8px 8px">Last note: ${E(i.hist.find(x=>x.type=='m').txt)}<div class=thumbs style="margin-top:6px">${thumbs((i.hist.find(x=>x.type=='m').ph))}</div></div>`:''}`).join('')||'<div class=empty><div></div><p>Everything is in working order.</p></div>')};
V.rep=()=>{const by=k=>{const m={};S.items.forEach(i=>m[i[k]]=(m[i[k]]||0)+1);const mx=Math.max(1,...Object.values(m));return Object.entries(m).sort((x,y)=>y[1]-x[1]).map(([x,y])=>`<div class=br><span>${E(x)}</span><div class=bar><i style="width:${100*y/mx}%"></i></div><b>${y}</b></div>`).join('')||'<div class=mut>No data</div>'};
 const out=S.items.filter(isOut),stat=(e,n,l)=>`<div class=stat><div class=e>${e}</div><div><div class=n>${n}</div><div class=l>${l}</div></div></div>`;
 $('#v').innerHTML=`<div class=row style="margin-bottom:10px"><h3 style="margin:0;flex:3 1 200px"> Department summary</h3><button class=p onclick=csv()> Export CSV</button><button onclick=print()> Print</button></div>
 <div class=stats>${stat('',S.items.length,'Records')}${stat('',out.length,'Out now')}${stat('',S.items.filter(i=>i.due).length,'Need service')}${stat('',S.locs.length,'Locations')}</div>
 <div class=g><div class=card><h4 style="margin-top:0">By category</h4>${by('cat')}</div><div class=card><h4 style="margin-top:0">By location</h4>${by('loc')}</div><div class=card><h4 style="margin-top:0">By condition</h4>${by('cond')}</div></div>
 <h4>Checked out right now</h4>${out.map(card).join('')||'<div class=card mut>Everything is back in store.</div>'}`};
function csv(){const k=['uid','cat','brand','model','serial','cond','loc','kind','qty','out','status','holder','notes'];
 const t=[k,...S.items.map(i=>k.map(x=>'"'+String(i[x]??'').replace(/"/g,'""').replace(/\n/g,' ')+'"'))].map(r=>r.join(',')).join('\n');

V.users=async()=>{await pend();const p=US.filter(u=>!u.ok);$('#v').innerHTML=`<h3> Users</h3>${p.length?`<div class=card style="border-color:var(--wn)"><b>⏳ ${p.length} waiting for approval</b></div>`:''}`+US.map((u,n)=>`<div class=item style="cursor:default"><div class=av style="width:44px;height:44px;font-size:18px">${E(u.name[0]).toUpperCase()}</div>
 <div class=im><div class=it>${E(u.name)}</div><div class=is>${u.google?'Google account':'Local account'}</div></div>
 <div class=row style="flex:none;flex-wrap:nowrap">${u.ok?`<select onchange="uact(${n},'role',this.value)" ${u.name==me.name?'disabled':''}><option value=core ${u.role=='core'?'selected':''}>Core user<option value=admin ${u.role=='admin'?'selected':''}>Web admin</select>`:`${pill('Pending','warn')}<button class=p onclick="uact(${n},'ok',1)">Approve</button>`}
 ${u.name!=me.name?`<button class=d onclick="rmUser(${n})">${u.ok?'Remove':'Reject'}</button>`:''}</div></div>`).join('')+
 `<div class=card><h4 style="margin-top:0">Settings</h4><button onclick="cpw()"> Change my password</button>
 <label>Google OAuth Client ID (optional)<input value="${E(GOOGLE)}" onchange="api('/api/settings','PUT',{google:this.value}).then(()=>toast('Saved. Reload to apply.'))"></label>
 <label>Locations (comma separated)<input value="${E(S.locs.join(', '))}" onchange="S.locs=this.value.split(',').map(x=>x.trim()).filter(Boolean);save()"></label>
 <div style="margin-top:10px" class=row><button onclick="bak()"> Download full backup (JSON)</button><button onclick="imp()"> Import data saved in this browser (old offline version)</button></div></div>`};
async function uact(n,k,v){const r=await api('/api/users/'+encodeURIComponent(US[n].name),'PATCH',{[k]:v});if(!r.ok)toast(r.d.error);await pend();render()}
async function bak(){const r=await fetch('/api/backup');const b=await r.blob(),l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='cadence-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(l);l.click();l.remove()}
async function imp(){let o;try{o=JSON.parse(localStorage.cad)}catch{return toast('No old data found in this browser')}
 const r=await ask('Import old data',[{t:'msg',v:`Add ${(o.items||[]).length} items from this browser? Existing UIDs are skipped.`}],'Import');if(!r)return;
 (o.items||[]).forEach(i=>{if(!S.items.some(x=>x.uid==i.uid))S.items.push({...i,id:nid(),hist:(i.hist||[]).map(h=>({...h,id:undefined}))})});(o.locs||[]).forEach(l=>{if(!S.locs.includes(l))S.locs.push(l)});Object.assign(S.cats,{...(o.cats||{}),...S.cats});save();toast('Imported');render()}
async function cpw(){const r=await ask('Change my password',[{l:'New password (6+ characters)',t:'password'}],'Update');if(!r)return;const x=await api('/api/password','POST',{password:r[0]});toast(x.ok?'Password updated':x.d.error)}
function M(h){const m=$('#m');if(h===undefined){m.style.display='none';m.innerHTML='';return}m.innerHTML='<div><button class=x onclick=M() title=Close>×</button>'+h+'</div>';m.style.display='block';m.scrollTop=0}
document.addEventListener('keydown',e=>e.key=='Escape'&&M());
load();
